<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Measles Predictor</title>
    
    <!-- Link to our CSS file -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Import the Chart.js library from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Regional Measles Outbreak Predictor</h1>
                <p>Global forecast for Measles based on historical WHO data.</p>
            </div>
            <button id="theme-toggle" class="theme-button">Toggle Theme</button>
        </header>

        <!-- Loading Spinner -->
        <div id="loader" class="loader"></div>

        <main id="dashboard-content" class="hidden">
            <!-- Row 1: The original charts -->
            <div class="chart-row">
                <div class="card">
                    <h2>Global Outbreak Radar</h2>
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="card">
                    <h2>Top High-Risk Countries</h2>
                    <canvas id="barChart"></canvas>
                </div>
            </div>

            <!-- Row 2: New Chart - Forecast vs. History -->
            <div class="card">
                <h2>Forecast vs. Historical Average (High-Risk)</h2>
                <canvas id="forecastVsHistoryChart"></canvas>
            </div>
            
            <!-- Row 3: New Chart - Regional Risk Distribution -->
            <div class="card">
                <h2>Risk Distribution by Region</h2>
                <canvas id="regionalRiskChart"></canvas>
            </div>

            <!-- Row 4: New Data Table -->
            <div class="card">
                <h2>Full Data Explorer</h2>
                <div id="dataTableContainer" class="data-table-container"></div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
